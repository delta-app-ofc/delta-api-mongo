spring.application.name=delta_api_mongo
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0

delta.mongodb.telemetry.uri=${MONGODB_TELEMETRY_URI}
delta.mongodb.telemetry.database=${MONGODB_TELEMETRY_DATABASE:db_delta_telemetry}

# Never capture telemetry request bodies in HTTP diagnostics.
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
spring.mvc.log-request-details=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
