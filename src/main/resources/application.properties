spring.application.name=delta_api_mongo
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0

delta.mongodb.telemetry.uri=${MONGODB_TELEMETRY_URI}
delta.mongodb.telemetry.database=${MONGODB_TELEMETRY_DATABASE:db_delta_telemetry}

# Never capture telemetry request bodies in HTTP diagnostics.
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
spring.mvc.log-request-details=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Detector de anomalias (desligado por padrão; ver delta.detection.* em DetectionProperties)
delta.detection.enabled=${DELTA_DETECTION_ENABLED:false}
delta.detection.config-version=${DELTA_DETECTION_CONFIG_VERSION:1}
delta.detection.owner.url=${DELTA_DETECTION_OWNER_URL:}
delta.detection.owner.service-key=${DELTA_DETECTION_OWNER_SERVICE_KEY:}

# Banco da aplicação (db_delta_app): baseline e alertas. Sem MONGODB_APP_URI, usa o mesmo cluster da telemetria.
delta.mongodb.app.uri=${MONGODB_APP_URI:${MONGODB_TELEMETRY_URI}}
delta.mongodb.app.database=${MONGODB_APP_DATABASE:db_delta_app}

# API de alertas (desligada por padrão): leitura pelo app com JWT do back-end e escrita da IA por chave de serviço
delta.alerts.enabled=${DELTA_ALERTS_ENABLED:false}
delta.alerts.service-key=${ALERTS_SERVICE_KEY:}
delta.alerts.auth.public-key=${AUTH_PUBLIC_KEY:}
delta.alerts.auth.issuer=${AUTH_ISSUER:delta-api}
delta.alerts.auth.audience=${AUTH_AUDIENCE:delta-api}

delta.web.allowed-origins=${DELTA_ALLOWED_ORIGINS:http://localhost:5173}
