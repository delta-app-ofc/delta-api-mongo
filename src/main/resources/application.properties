spring.application.name=delta_api_mongo
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0

delta.mongodb.telemetry.uri=${MONGODB_TELEMETRY_URI}
delta.mongodb.telemetry.database=${MONGODB_TELEMETRY_DATABASE:db_delta_telemetry}

delta.device-validation.sql-api-base-url=${SQL_API_BASE_URL:}
delta.device-validation.service-credential=${MONGO_SERVICE_CREDENTIAL:}
delta.device-validation.connect-timeout=${SQL_AUTH_CONNECT_TIMEOUT:2s}
delta.device-validation.response-timeout=${SQL_AUTH_RESPONSE_TIMEOUT:5s}

# Never capture credentials or validation bodies in HTTP diagnostics.
logging.level.jdk.internal.net.http=OFF
logging.level.jdk.httpclient.HttpClient=OFF
logging.level.org.springframework.web.client.DefaultRestClient=OFF
logging.level.org.springframework.http.converter.StringHttpMessageConverter=OFF
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
spring.mvc.log-request-details=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
